<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laly Cosmetics - Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

  <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-[#E5235E] rounded-full flex items-center justify-center text-white font-bold text-sm">laly</div>
      <h1 class="font-bold text-lg text-gray-900">Panel de Administración</h1>
    </div>
    <a href="../index.html" target="_blank" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg font-medium transition">
      🌐 Ver Tienda en Vivo
    </a>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 grid lg:grid-cols-3 gap-8">
    
    <div class="lg:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
      <h2 class="text-lg font-bold text-gray-900 mb-4 pb-2 border-b">Agregar / Editar Producto</h2>
      
      <form id="productForm" class="space-y-4">
        <input type="hidden" id="productId">

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Nombre del Producto *</label>
          <input type="text" id="title" required placeholder="Ej: CeraVe Retinol Serum" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:border-[#E5235E]">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Categoría *</label>
            <select id="category" required class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:border-[#E5235E]">
              <option value="Skincare">Skincare</option>
              <option value="Maquillaje">Maquillaje</option>
              <option value="Labios">Labios</option>
              <option value="Accesorios">Accesorios</option>
              <option value="Combos">Combos / Ofertas</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Precio ($ USD) *</label>
            <input type="number" id="price" step="0.01" min="0" required placeholder="18.00" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:border-[#E5235E]">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Stock Disponible (0 = Agotado) *</label>
          <input type="number" id="stock" min="0" required placeholder="10" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:border-[#E5235E]">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">URL de la Imagen *</label>
          <input type="url" id="imageUrl" required placeholder="https://images.unsplash.com/..." class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:border-[#E5235E]">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Descripción Corta</label>
          <textarea id="description" rows="2" placeholder="Detalles o beneficios del producto..." class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:border-[#E5235E]"></textarea>
        </div>

        <div class="flex items-center gap-3 bg-rose-50 p-3 rounded-lg border border-rose-100">
          <input type="checkbox" id="isFeatured" class="w-4 h-4 text-[#E5235E] rounded border-gray-300 focus:ring-[#E5235E]">
          <label for="isFeatured" class="text-xs font-medium text-gray-700 cursor-pointer">
            ✨ Mostrar en el **Carrusel de Destacados**
          </label>
        </div>

        <button type="submit" id="btnSave" class="w-full bg-[#E5235E] text-white py-2.5 rounded-lg font-semibold text-sm hover:bg-[#C2184B] transition shadow-md shadow-rose-200">
          Guardar Producto
        </button>
      </form>
    </div>

    <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
      <h2 class="text-lg font-bold text-gray-900 mb-4 pb-2 border-b flex justify-between items-center">
        <span>Inventario Registrado</span>
        <span id="productCount" class="text-xs bg-gray-100 text-gray-600 px-2.5 py-1 rounded-full font-semibold">0 productos</span>
      </h2>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead>
            <tr class="text-xs text-gray-400 uppercase border-b">
              <th class="pb-2">Producto</th>
              <th class="pb-2">Categoría</th>
              <th class="pb-2">Precio</th>
              <th class="pb-2">Stock</th>
              <th class="pb-2">Destacado</th>
              <th class="pb-2 text-right">Acción</th>
            </tr>
          </thead>
          <tbody id="inventoryList" class="divide-y divide-gray-100">
            <tr>
              <td colspan="6" class="py-6 text-center text-gray-400 text-xs">Cargando productos...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <script src="../js/firebase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
